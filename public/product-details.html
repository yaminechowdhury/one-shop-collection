<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | One Shop Collection</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <a href="index.html">
                <img src="logo.png" alt="One Shop Collection Logo" class="navbar-logo">
            </a>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="product-details.html" class="active">Product Details</a></li>
                <li><a href="cart.html">Cart</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
        <div class="nav-icons">
            <a href="#"><i class="fa-solid fa-magnifying-glass"></i></a>
            <a href="cart.html" class="cart-icon">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="badge">0</span>
            </a>
        </div>
    </header>

    <section class="details-container">
        <div class="details-img">
            <img src="https://via.placeholder.com/400x350" alt="Product Image">
        </div>
        <div class="details-info">
            <h2>Wireless Headphone Pro</h2>
            <p class="price">$150.00</p>
            <p class="desc">High-quality sound with active noise cancellation, fast charging, and long battery life. Perfect for music lovers and professionals.</p>
            <div class="quantity">
                <label>Quantity:</label>
                <input type="number" value="1" min="1">
            </div>
            <button class="add-cart-btn">Add to Cart</button>
        </div>
    </section>

</body>
</html>
