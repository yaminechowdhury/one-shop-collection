<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop | One Shop Collection</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Emergency CSS reset for logo to fix large overlay */
        .brand-logo { max-width: 180px; height: auto; display: block; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="top-info">
            <span><i class="fa-solid fa-phone"></i> +8801760893895</span>
            <span><i class="fa-solid fa-envelope"></i> oneshopcollection69@gmail.com</span>
            <span><i class="fa-solid fa-location-arrow"></i> Joydebpur, Gazipur</span>
        </div>
    </div>

    <header class="main-header">
        <div class="brand-logo-area">
            <a href="index.html" class="brand-link">
                <img src="logo.png" alt="One Shop Collection" class="brand-logo">
            </a>
        </div>
        <div class="header-search-bar">
            <input type="text" placeholder="Search products...">
            <button class="search-submit"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
        <div class="header-widgets">
            <a href="wishlist.html" class="widget-box"><i class="fa-regular fa-heart"></i></a>
            <a href="cart.html" class="widget-box"><i class="fa-solid fa-basket-shopping"></i></a>
        </div>
    </header>

    <nav class="navbar">
        <ul class="nav-menu">
            <li><a href="index.html"><i class="fa-solid fa-house"></i> HOME</a></li>
            <li><a href="shop.html" class="active"><i class="fa-solid fa-cart-shopping"></i> SHOP</a></li>
            <li><a href="wishlist.html"><i class="fa-solid fa-bag-shopping"></i> WISHLIST</a></li>
            <li><a href="cart.html"><i class="fa-solid fa-basket-shopping"></i> CART</a></li>
            <li><a href="checkout.html"><i class="fa-solid fa-share"></i> CHECKOUT</a></li>
            <li><a href="account.html"><i class="fa-solid fa-user"></i> MY ACCOUNT</a></li>
        </ul>
    </nav>

    <div class="main-container">
        <h2 class="section-title">ALL PRODUCTS</h2>
        <div class="product-grid">
            <div class="product-card">
                <img src="https://via.placeholder.com/300x250" alt="Product">
                <div class="card-body">
                    <h3>Premium Men's Shirt</h3>
                    <div class="price">৳ 1,250.00</div>
                    <button class="add-to-cart-btn"><i class="fa-solid fa-basket-shopping"></i> ADD TO CART</button>
                </div>
            </div>
            <div class="product-card">
                <img src="https://via.placeholder.com/300x250" alt="Product">
                <div class="card-body">
                    <h3>Leather Wallet</h3>
                    <div class="price">৳ 850.00</div>
                    <button class="add-to-cart-btn"><i class="fa-solid fa-basket-shopping"></i> ADD TO CART</button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
