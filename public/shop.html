<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Shop Collection | Customer Store</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --bg-dark: #121212;
            --bg-card: #1e1e1e;
            --accent-gold: #ffb400;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: #333333;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
        }

        /* Navbar */
        .navbar {
            background-color: #1a1a1a;
            border-bottom: 1px solid var(--border-color);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-logo {
            color: var(--accent-gold);
            font-size: 1.4rem;
            font-weight: bold;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cart-icon-btn {
            position: relative;
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.3rem;
            cursor: pointer;
        }

        .cart-count-badge {
            position: absolute;
            top: -8px;
            right: -10px;
            background: var(--accent-gold);
            color: #000;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Container Sections */
        .section-container {
            padding: 40px 5%;
        }

        .section-title {
            color: var(--accent-gold);
            font-size: 1.5rem;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid var(--accent-gold);
            display: inline-block;
            padding-bottom: 5px;
        }

        /* Dynamic Product Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 25px;
        }

        /* Product Card Styling */
        .product-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-gold);
        }

        .product-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 6px;
            background-color: #2a2a2a;
            margin-bottom: 12px;
        }

        .product-title {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .size-tags-box {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .size-tag {
            background: #2a2a2a;
            color: var(--accent-gold);
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 3px;
            border: 1px solid #444;
        }

        .product-price {
            color: var(--accent-gold);
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .btn-add-cart {
            width: 100%;
            background-color: var(--accent-gold);
            color: #000;
            border: none;
            padding: 10px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .btn-add-cart:hover {
            background-color: #e09e00;
        }

        .no-products-msg {
            color: var(--text-muted);
            font-style: italic;
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px 0;
            background: var(--bg-card);
            border-radius: 8px;
            border: 1px dashed var(--border-color);
        }
    </style>
</head>
<body>

    <!-- Header Navbar -->
    <header class="navbar">
        <a href="#" class="brand-logo">
            <i class="fa-solid fa-store"></i> ONE SHOP COLLECTION
        </a>
        <button class="cart-icon-btn">
            <i class="fa-solid fa-cart-shopping"></i>
            <span class="cart-count-badge" id="cartCount">0</span>
        </button>
    </header>

    <!-- 1. FEATURED PRODUCTS SECTION -->
    <section class="section-container">
        <h2 class="section-title">Featured Products</h2>
        <div id="featured-products-container" class="products-grid">
            <!-- JavaScript-এর মাধ্যমে অ্যাডমিন প্যানেলের ডাটা এখানে লোড হবে -->
        </div>
    </section>

    <hr style="border: none; border-top: 1px solid var(--border-color); margin: 0 5%;">

    <!-- 2. ALL PRODUCTS SECTION -->
    <section class="section-container">
        <h2 class="section-title">All Products</h2>
        <div id="all-products-container" class="products-grid">
            <!-- JavaScript-এর মাধ্যমে সব ডাটা এখানে লোড হবে -->
        </div>
    </section>

    <!-- JavaScript Logic -->
    <script>
        // অ্যাডমিন প্যানেল থেকে অ্যাড করা প্রোডাক্ট লোড করার ফাংশন
        function renderStoreProducts() {
            // Admin Panel LocalStorage Key ('admin_products') থেকে ডাটা পড়া
            const storedProducts = JSON.parse(localStorage.getItem('admin_products')) || [];

            const featuredContainer = document.getElementById('featured-products-container');
            const allProductsContainer = document.getElementById('all-products-container');

            // প্রথমে কন্টেইনার দুটো খালি করা (ডামি প্রোডাক্ট পুরোপুরি মুছে ফেলা)
            featuredContainer.innerHTML = '';
            allProductsContainer.innerHTML = '';

            // যদি অ্যাডমিন কোনো প্রোডাক্ট না যোগ করে থাকে
            if (storedProducts.length === 0) {
                const emptyHTML = `<div class="no-products-msg"><i class="fa-solid fa-box-open" style="font-size:2rem; margin-bottom:10px; display:block;"></i>No products available in the store right now. Add products from Admin Panel!</div>`;
                featuredContainer.innerHTML = emptyHTML;
                allProductsContainer.innerHTML = emptyHTML;
                return;
            }

            // প্রতিটি প্রোডাক্টের জন্য HTML Card তৈরি করা
            storedProducts.forEach((product, index) => {
                // সাইজ ব্যাজ তৈরি করা (যদি কাস্টম সাইজ দেওয়া থাকে)
                let sizesHTML = '';
                if (product.sizes && product.sizes.length > 0) {
                    sizesHTML = product.sizes.map(s => `<span class="size-tag">${s}</span>`).join('');
                }

                const cardHTML = `
                    <div class="product-card">
                        <div>
                            <img src="${product.img}" alt="${product.title}" class="product-img">
                            <h3 class="product-title">${product.title}</h3>
                            <div class="size-tags-box">${sizesHTML}</div>
                        </div>
                        <div>
                            <div class="product-price">৳ ${product.price.toLocaleString()}</div>
                            <button class="btn-add-cart" onclick="addToCart(${product.id})">
                                <i class="fa-solid fa-cart-shopping"></i> ADD TO CART
                            </button>
                        </div>
                    </div>
                `;

                // All Products কন্টেইনারে সব যোগ করা
                allProductsContainer.innerHTML += cardHTML;

                // Featured Products সেকশনে প্রথম ৪টি প্রোডাক্ট যোগ করা
                if (index < 4) {
                    featuredContainer.innerHTML += cardHTML;
                }
            });
        }

        // সিম্পল কার্ট কাউন্টার ফাংশন
        let cartCount = 0;
        function addToCart(productId) {
            cartCount++;
            document.getElementById('cartCount').innerText = cartCount;
            alert('Product added to cart!');
        }

        // পেজ লোড হলেই প্রোডাক্টগুলো সাথে সাথে শো করবে
        document.addEventListener('DOMContentLoaded', renderStoreProducts);
    </script>
</body>
</html>
