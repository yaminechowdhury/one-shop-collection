<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Shop Collection | Home</title>
<!-- FontAwesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- Swiper Slider CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
<!-- Swiper Slider JS -->
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<link rel="stylesheet" href="style.css">
<style>
.product-card {
  background: #242424;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid #333;
  position: relative;
}
.product-slider {
  width: 100%;
  height: 220px;
  background: #1a1a1a;
}
.product-slider img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.badge-tag {
  position: absolute;
  top: 10px;
  left: 10px;
  background: #ffb400;
  color: #000;
  padding: 3px 8px;
  font-size: 0.75rem;
  font-weight: bold;
  border-radius: 4px;
  z-index: 10;
}
.card-body {
  padding: 15px;
}
.price {
  color: #ffb400;
  font-size: 1.1rem;
  font-weight: bold;
  margin: 10px 0;
}
.add-to-cart-btn, .view-details-btn {
  width: 100%;
  padding: 8px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-weight: bold;
  margin-top: 5px;
}
.add-to-cart-btn { background: #ffb400; color: #000; }
.view-details-btn { background: #333; color: #fff; }

/* Product Details Modal */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.85);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 3000;
}
.modal-content {
  background: #242424;
  width: 90%;
  max-width: 600px;
  border-radius: 8px;
  padding: 20px;
  position: relative;
  border: 1px solid #ffb400;
  max-height: 90vh;
  overflow-y: auto;
}
.close-modal-btn {
  position: absolute;
  top: 10px; right: 15px;
  color: #fff;
  font-size: 1.5rem;
  cursor: pointer;
}
.detail-slider {
  width: 100%;
  height: 300px;
  border-radius: 6px;
  overflow: hidden;
  margin-bottom: 15px;
}
.detail-slider img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
</style>
</head>
<body>
<!-- 1. Top Header Bar -->
<div class="top-bar">
<div class="top-info">
<span><i class="fa-solid fa-phone"></i> +8801760893895</span>
<span><i class="fa-solid fa-envelope"></i> oneshopcollection69@gmail.com</span>
<span><i class="fa-solid fa-location-arrow"></i> Joydebpur, Gazipur City Corporation, Gazipur</span>
</div>
<div class="top-links">
<a href="about.html"><i class="fa-solid fa-info-circle"></i> About Us</a>
<a href="contact.html"><i class="fa-solid fa-comments"></i> Contact Us</a>
<a href="https://www.facebook.com/oneshopcollection77" target="_blank"><i class="fa-brands fa-facebook-f"></i></a>
<a href="https://wa.me/8801760893895" target="_blank"><i class="fa-brands fa-whatsapp"></i></a>
</div>
</div>

<!-- 2. Main Branding & Search Header -->
<header class="main-header">
<div class="brand-logo-area">
<a href="index.html" class="brand-link">
<img src="logo.png" alt="One Shop Collection" class="brand-logo">
<div class="brand-text">
<h1>One Shop Collection</h1>
<p>A Luxury Clothing & Lifestyle Brand</p>
</div>
</a>
</div>
<div class="header-search-bar">
<select class="category-dropdown" id="searchCategorySelect">
<option value="all">All Categories</option>
</select>
<input type="text" id="searchInput" placeholder="Search...">
<button class="search-submit"><i class="fa-solid fa-magnifying-glass"></i></button>
</div>
<div class="header-widgets">
<a href="wishlist.html" class="widget-box">
<i class="fa-regular fa-heart"></i>
<span class="count-badge">0</span>
</a>
<a href="cart.html" class="widget-box cart-widget">
<i class="fa-solid fa-basket-shopping"></i>
<span class="count-badge">0</span>
<div class="cart-details">
<span class="label">Total</span>
<span class="price">0.00</span>
</div>
</a>
</div>
</header>

<!-- 3. Navigation Bar -->
<nav class="navbar">
<ul class="nav-menu">
<li><a href="index.html" class="active"><i class="fa-solid fa-house"></i> HOME</a></li>
<li><a href="shop.html"><i class="fa-solid fa-cart-shopping"></i> SHOP</a></li>
<li><a href="wishlist.html"><i class="fa-solid fa-bag-shopping"></i> WISHLIST</a></li>
<li><a href="cart.html"><i class="fa-solid fa-basket-shopping"></i> CART</a></li>
<li><a href="checkout.html"><i class="fa-solid fa-share"></i> CHECKOUT</a></li>
<li><a href="account.html"><i class="fa-solid fa-user"></i> MY ACCOUNT</a></li>
</ul>
<div class="account-dropdown-btn">
<a href="account.html"><i class="fa-solid fa-user"></i> My Account <i class="fa-solid fa-caret-down"></i></a>
</div>
</nav>

<!-- Product Grid -->
<section class="main-container" style="padding: 30px;">
<h2 class="section-title" style="color: #ffb400; margin-bottom: 20px;">FEATURED PRODUCTS</h2>
<div class="product-grid" id="featured-products-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px;">
  <!-- Dynamic featured products with image slider -->
</div>
</section>

<!-- Product View Details Modal -->
<div class="modal-overlay" id="productDetailModal">
  <div class="modal-content">
    <span class="close-modal-btn" onclick="closeDetailModal()">&times;</span>
    <div class="swiper detail-slider" id="detailSwiper">
      <div class="swiper-wrapper" id="detail-slider-wrapper"></div>
      <div class="swiper-button-next"></div>
      <div class="swiper-button-prev"></div>
      <div class="swiper-pagination"></div>
    </div>
    <h2 id="detailTitle" style="color: #ffb400;"></h2>
    <div id="detailCategory" style="color: #aaa; margin: 5px 0;"></div>
    <div id="detailPrice" class="price"></div>
    <p id="detailDescription" style="color: #ddd; font-size: 0.9rem; margin-bottom: 15px;"></p>
    <button class="add-to-cart-btn"><i class="fa-solid fa-basket-shopping"></i> ADD TO CART</button>
  </div>
</div>

<script>
  let featuredProducts = [];

  function loadFeaturedProducts() {
    const container = document.getElementById('featured-products-container');
    const allProducts = JSON.parse(localStorage.getItem('admin_products')) || [];
    
    featuredProducts = allProducts.filter(p => p.isFeatured && !p.isHidden);
    container.innerHTML = '';

    if (featuredProducts.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#888; grid-column: 1 / -1;">No Featured Products Available!</p>';
      return;
    }

    featuredProducts.forEach((p, idx) => {
      const imagesList = (p.images && p.images.length > 0) ? p.images : [p.img || ''];
      
      let slidesHTML = imagesList.map(imgSrc => `<div class="swiper-slide"><img src="${imgSrc}" alt="${p.title}"></div>`).join('');

      container.innerHTML += `
        <div class="product-card">
          <div class="badge-tag">${p.category || 'Featured'}</div>
          
          <!-- Image Slider -->
          <div class="swiper product-slider prod-swiper-${idx}">
            <div class="swiper-wrapper">
              ${slidesHTML}
            </div>
          </div>

          <div class="card-body">
            <h3>${p.title}</h3>
            <div class="price">৳ ${Number(p.price).toLocaleString()}</div>
            <button class="view-details-btn" onclick="openDetailModal(${idx})"><i class="fa-solid fa-eye"></i> View Details</button>
            <button class="add-to-cart-btn"><i class="fa-solid fa-basket-shopping"></i> ADD TO CART</button>
          </div>
        </div>
      `;
    });

    // Initialize Card Swipers with Autoplay
    featuredProducts.forEach((_, idx) => {
      new Swiper(`.prod-swiper-${idx}`, {
        loop: true,
        autoplay: {
          delay: 2500,
          disableOnInteraction: false,
        },
      });
    });
  }

  function openDetailModal(idx) {
    const p = featuredProducts[idx];
    const imagesList = (p.images && p.images.length > 0) ? p.images : [p.img || ''];

    document.getElementById('detailTitle').innerText = p.title;
    document.getElementById('detailCategory').innerText = "Category: " + (p.category || 'General');
    document.getElementById('detailPrice').innerText = "৳ " + Number(p.price).toLocaleString();
    document.getElementById('detailDescription').innerText = p.details || "No details provided.";

    const wrapper = document.getElementById('detail-slider-wrapper');
    wrapper.innerHTML = imagesList.map(imgSrc => `<div class="swiper-slide"><img src="${imgSrc}"></div>`).join('');

    document.getElementById('productDetailModal').style.display = 'flex';

    // Initialize Modal Swiper
    new Swiper('#detailSwiper', {
      loop: true,
      autoplay: { delay: 2000 },
      navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' },
      pagination: { el: '.swiper-pagination', clickable: true },
    });
  }

  function closeDetailModal() {
    document.getElementById('productDetailModal').style.display = 'none';
  }

  document.addEventListener('DOMContentLoaded', loadFeaturedProducts);
</script>
</body>
</html>
