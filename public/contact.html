        </ul>
    </nav>

    <div class="main-container">
        <h2 class="section-title">CONTACT US</h2>
        <div style="display: flex; gap: 30px; flex-wrap: wrap;">
            <div style="flex: 1; min-width: 280px; background: #2a2a2a; padding: 25px; border-radius: 4px;">
                <h3 style="color: #ffb400; margin-bottom: 15px;">GET IN TOUCH</h3>
                <p style="margin-bottom: 10px;"><i class="fa-solid fa-location-dot" style="color: #ffb400;"></i> Joydebpur, Gazipur City Corporation, Gazipur</p>
                <p style="margin-bottom: 10px;"><i class="fa-solid fa-phone" style="color: #ffb400;"></i> +8801760893895</p>
                <p style="margin-bottom: 10px;"><i class="fa-solid fa-envelope" style="color: #ffb400;"></i> oneshopcollection69@gmail.com</p>
            </div>
            <div style="flex: 2; min-width: 300px; background: #2a2a2a; padding: 25px; border-radius: 4px;">
                <form style="display: flex; flex-direction: column; gap: 15px;">
                    <input type="text" placeholder="Your Name" style="padding: 12px; background: #1c1c1c; border: 1px solid #444; color: #fff;">
                    <input type="email" placeholder="Your Email" style="padding: 12px; background: #1c1c1c; border: 1px solid #444; color: #fff;">
                    <textarea rows="5" placeholder="Your Message" style="padding: 12px; background: #1c1c1c; border: 1px solid #444; color: #fff;"></textarea>
                    <button type="submit" style="background: #ffb400; color: #000; border: none; padding: 12px; font-weight: bold; cursor: pointer;">SEND MESSAGE</button>
                </form>
            </div>
        </div>
    </div>
